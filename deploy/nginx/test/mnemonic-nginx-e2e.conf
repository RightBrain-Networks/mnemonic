include /etc/nginx/modules/*.conf;

events {}

http {
    access_log off;
    error_log /dev/stderr warn;

    # Exercise the supported optional filter as an inherited hostile default.
    # The control response must be Brotli-coded while the shared dashboard API
    # policy remains identity-coded without a module-specific directive.
    brotli on;
    brotli_comp_level 4;
    brotli_min_length 1;
    brotli_types application/json;

    server {
        listen 8080;
        server_name _;

        location = /brotli-control {
            default_type application/json;
            return 200 '{"payload":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}';
        }

        location ^~ /api/mnemonic/ {
            include /etc/nginx/snippets/mnemonic-dashboard-api-policy.conf;

            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream off;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade "";
            proxy_set_header Connection "";

            proxy_pass http://web:3000;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Accept-Encoding "identity";
            proxy_pass http://web:3000;
        }
    }
}
