include /etc/nginx/modules/*.conf;

events {}

http {
    access_log off;
    error_log /dev/stderr warn;
    brotli on;
    brotli_comp_level 4;
    brotli_min_length 1;
    brotli_types application/json;

    map $uri $browser_upgrade {
        default '';
        /api/mnemonic/sync $http_upgrade;
    }

    map $browser_upgrade $browser_connection {
        default upgrade;
        '' '';
    }

    server {
        listen 8080;
        server_name _;
        large_client_header_buffers 4 32k;
        client_max_body_size 1g;

        location = /brotli-control {
            default_type application/json;
            return 200 '{"payload":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}';
        }

        location ~ ^/api/(?:mnemonic|artifacts|transcripts|backups)(?:/|$) {
            include /etc/nginx/snippets/mnemonic-dashboard-api-policy.conf;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 1805s;
            proxy_send_timeout 1805s;
            proxy_next_upstream off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade $browser_upgrade;
            proxy_set_header Connection $browser_connection;
            proxy_pass http://api:8000;
        }

        location ~ ^/(?:api/v1|worker|projects|docs|redoc|openapi\.json)(?:/|$) {
            return 404;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Accept-Encoding "identity";
            proxy_pass http://web:3000;
        }
    }
}
