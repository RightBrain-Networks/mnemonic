# Mnemonic -- host-managed TLS reverse proxy.
#
# Repository copy; installing/rebuilding Mnemonic does NOT install this file.
# Live destination: /etc/nginx/conf.d/mnemonic.conf
# Read deploy/nginx/README.md before installing. Enable compose.tls.yaml too:
# the dashboard and MCP server otherwise reject the public Host/Origin.
#
# Assumptions: nginx runs on the Docker host; Mnemonic publishes its default
# ports on loopback only; DNS points mnemonic.example.com to that host.
# This is a trusted-LAN deployment. The dashboard has no login by default.
#
# This entire file belongs in nginx's http context (the usual conf.d include).
# It is self-contained: no host-specific snippets or nginx.conf variables needed.

geo $mnemonic_allowed {
    default         0;
    127.0.0.1/32    1;
    ::1/128         1;
    192.168.0.0/16  1;

    # Optional: the custom Docker pool in the supplied example.
    # 198.51.100.0/24 is PUBLIC address space, not an RFC 1918 private subnet.
    # Enable only if this is really your local pool and its clients are trusted.
    # 198.51.100.0/24  1;
}

# Omit query strings, Referer, request bodies, and credentials from access logs:
# search queries can contain private prompt text. Error logs can still contain
# request URLs; keep all logs private and configure rotation (see README).
log_format mnemonic_access
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    'host=$host rt=$request_time '
    'uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time '
    'us=$upstream_status ua=$upstream_addr '
    'reqlen=$request_length cid=$connection creq=$connection_requests';

# Do not claim default_server on a host shared with other applications.
server {
    listen 80;
    server_name mnemonic.example.com;

    access_log /var/log/nginx/mnemonic/redirect.access.log mnemonic_access;
    error_log  /var/log/nginx/mnemonic/redirect.error.log warn;

    if ($mnemonic_allowed = 0) { return 444; }
    if ($host != mnemonic.example.com) { return 444; }

    # Fixed hostname prevents Host-based redirects; 308 preserves the method.
    # MCP clients must use HTTPS directly: a redirect cannot protect a bearer
    # token that a client already sent over HTTP.
    return 308 https://mnemonic.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mnemonic.example.com;

    # Optional with nginx >= 1.25.1: http2 on;
    # No short-name TLS alias: the wildcard certificate covers the FQDN.
    ssl_certificate     /etc/nginx/certs/star.example.com.chained.crt;
    ssl_certificate_key /etc/nginx/certs/star.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:MnemonicTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Limited to this hostname; does not affect sibling applications.
    add_header Strict-Transport-Security "max-age=86400" always;
    server_tokens off;

    access_log /var/log/nginx/mnemonic/web.access.log mnemonic_access;
    error_log  /var/log/nginx/mnemonic/web.error.log warn;

    # Server-level guards protect every location, including /mcp.
    if ($mnemonic_allowed = 0) { return 444; }
    if ($host != mnemonic.example.com) { return 444; }

    client_max_body_size 1m;
    client_body_timeout 30s;
    send_timeout 60s;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache off;
    proxy_next_upstream off;

    # $host normalizes the public hostname, including an explicit default :443.
    # Replace untrusted forwarded headers at this first/only edge proxy.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";

    # Origin, Sec-Fetch-Site, Authorization, and MCP protocol headers pass
    # through unchanged. Never inject the API key or rewrite Origin here.
    # A proxy_set_header in a location would replace this WHOLE inherited set;
    # keep all header directives together at this level.

    location = /mcp {
        access_log /var/log/nginx/mnemonic/mcp.access.log mnemonic_access;
        error_log  /var/log/nginx/mnemonic/mcp.error.log warn;

        client_max_body_size 2m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;

        # No URI suffix: preserve /mcp exactly. Supports Streamable HTTP,
        # including streamed responses; it is not a WebSocket endpoint.
        # Authentication stays with MCP (Authorization: Bearer ...).
        proxy_pass http://127.0.0.1:8001;
    }

    # Prevent accidental /mcp/ requests from reaching Next.js or triggering an
    # upstream redirect to an internal HTTP address. Configure clients as /mcp.
    location ^~ /mcp/ {
        return 404;
    }

    location / {
        # Enable BOTH lines if anyone on the allowed LAN is not trusted with
        # all prompts. Create the password file first (instructions in README).
        # Keep Basic auth here, away from MCP's Bearer Authorization header.
        # auth_basic "Mnemonic";
        # auth_basic_user_file /etc/nginx/mnemonic.htpasswd;

        # Includes /api/mnemonic/*, the Next.js server-side API proxy. Sending
        # that path directly to FastAPI would bypass the dashboard's checks.
        # FastAPI :8000 and PostgreSQL remain private; neither is published here.
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3000;
    }
}
