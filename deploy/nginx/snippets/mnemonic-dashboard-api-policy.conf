# Phase 11 dashboard API response policy.
#
# Include this file from the dashboard API proxy location. That location must
# also repeat the complete trusted proxy_set_header set because this snippet
# deliberately defines Accept-Encoding at location scope.
gzip off;
proxy_buffering off;
proxy_cache off;
proxy_set_header Accept-Encoding "identity";

# Phase 11 evidence responses carry an explicit `Content-Encoding: identity`
# from Next.js. Preserve that header: native gzip and google/ngx_brotli do not
# recode a response that already has a content coding. The deployed-path test
# proves this with ngx_brotli loaded and inherited `brotli on`, then separately
# syntax-checks this same snippet on stock nginx without that optional module.

# Replace rather than duplicate the application values at the outer edge.
proxy_hide_header Cache-Control;
proxy_hide_header X-DNS-Prefetch-Control;
add_header Cache-Control "no-store, max-age=0, no-transform" always;
add_header X-DNS-Prefetch-Control "off" always;

# A location containing add_header does not inherit server-level headers.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
