# Isolated, disposable database for tests. Does not read the application .env.
name: mnemonic-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mnemonic_test
      POSTGRES_USER: mnemonic_test
      POSTGRES_PASSWORD: mnemonic_test_only
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mnemonic_test -d mnemonic_test']
      interval: 2s
      timeout: 5s
      retries: 20
