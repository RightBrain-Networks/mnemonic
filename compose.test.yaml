# Isolated, disposable services for tests. Does not read the application .env.
name: mnemonic-test
services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: mnemonic_test
      POSTGRES_USER: mnemonic_test
      POSTGRES_PASSWORD: mnemonic_test_only
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mnemonic_test -d mnemonic_test']
      interval: 2s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.4-alpine@sha256:8425b8435b0203e87292cf1a4a7e5f8108c610bbd8217f8cc952f43628b24987
    environment:
      RABBITMQ_DEFAULT_USER: mnemonic_test
      RABBITMQ_DEFAULT_PASS: mnemonic_test_only
    ports:
      - '127.0.0.1:5673:5672'
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 2s
      timeout: 5s
      retries: 30
