# Disposable browser and backup acceptance stack. Invoke through scripts/test-e2e.sh.
services:
  rabbitmq:
    image: rabbitmq:4.2-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mnemonic_e2e
      RABBITMQ_DEFAULT_PASS: mnemonic_e2e_only
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mnemonic_e2e
      POSTGRES_USER: mnemonic_e2e
      POSTGRES_PASSWORD: mnemonic_e2e_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mnemonic_e2e -d mnemonic_e2e']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"

  api:
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mnemonic_e2e:mnemonic_e2e_only@postgres:5432/mnemonic_e2e
      MNEMONIC_API_KEY: ${MNEMONIC_E2E_API_KEY:?Run through scripts/test-e2e.sh}
      MNEMONIC_DASHBOARD_ORIGINS: ${MNEMONIC_DASHBOARD_ORIGINS:?Run through scripts/test-e2e.sh}
      MNEMONIC_ARTIFACT_ROOT: /var/lib/mnemonic/artifacts
      MNEMONIC_PROMPT_ROOT: /var/lib/mnemonic/prompts
      MNEMONIC_TRANSCRIPT_INDEX_DIR: /var/lib/mnemonic/transcript-index
      MNEMONIC_TRANSCRIPT_ALLOWED_ROOTS: '["/var/lib/mnemonic/artifacts/transcripts"]'
      MNEMONIC_WORK_SUMMARY_MAX_CHARS: ${MNEMONIC_E2E_WORK_SUMMARY_MAX_CHARS:-2048}
      MNEMONIC_ARTIFACT_MAX_BYTES: 67108864
      MNEMONIC_ARTIFACT_TIKA_URL: http://tika:9998
    volumes:
      - &prompt-mount
        type: bind
        source: ${MNEMONIC_E2E_PROMPT_DIR:?Run through the isolated test runner}
        target: /var/lib/mnemonic/prompts
        bind:
          create_host_path: false
      - &artifact-mount
        type: bind
        source: ${MNEMONIC_E2E_ARTIFACT_DIR:?Run through the isolated test runner}
        target: /var/lib/mnemonic/artifacts
        bind:
          create_host_path: false
      - type: bind
        source: ${MNEMONIC_E2E_TRANSCRIPT_INDEX_DIR:?Run through the isolated test runner}
        target: /var/lib/mnemonic/transcript-index
        bind:
          create_host_path: false
    ports:
      - '127.0.0.1:${MNEMONIC_E2E_API_PORT:?Run through scripts/test-e2e.sh}:8000'
    networks: [default, artifact_parser]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=3)']
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s
    init: true
    restart: "no"
    security_opt: [no-new-privileges:true]

  tika:
    build: ./deploy/tika
    networks: [artifact_parser]
    dns: [127.0.0.1]
    logging:
      driver: none
    healthcheck:
      test: [CMD, bash, /opt/mnemonic-tika/healthcheck.sh]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=1280m,mode=1777,noexec,nosuid,nodev
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: "no"

  web:
    build: ./frontend
    environment:
      TIMEZONE: ${TIMEZONE:-America/Detroit}
      MNEMONIC_WORK_SUMMARY_MAX_CHARS: ${MNEMONIC_E2E_WORK_SUMMARY_MAX_CHARS:-2048}
      MNEMONIC_ARTIFACT_MAX_BYTES: 67108864
      MNEMONIC_API_URL: http://api:8000
      MNEMONIC_API_KEY: ${MNEMONIC_E2E_API_KEY:?Run through scripts/test-e2e.sh}
      MNEMONIC_BACKUP_URL: http://worker:8002
      MNEMONIC_BACKUP_TOKEN: ${MNEMONIC_E2E_BACKUP_TOKEN:?Run through scripts/test-e2e.sh}
      MNEMONIC_BACKUP_MAX_BYTES: 2097152
      MNEMONIC_DASHBOARD_ORIGINS: ${MNEMONIC_DASHBOARD_ORIGINS:?Run through scripts/test-e2e.sh}
    ports:
      - '127.0.0.1:${MNEMONIC_E2E_WEB_PORT:?Run through scripts/test-e2e.sh}:3000'
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s
    init: true
    restart: "no"
    security_opt: [no-new-privileges:true]

  worker:
    build: *backend-build
    command: [uvicorn, 'mnemonic_api.job_worker:create_app', --factory, --host, 0.0.0.0, --port, '8002', --no-access-log, --log-config, logging.json]
    environment:
      DATABASE_URL: postgresql+psycopg://mnemonic_e2e:mnemonic_e2e_only@postgres:5432/mnemonic_e2e
      MNEMONIC_API_KEY: ${MNEMONIC_E2E_API_KEY:?Run through scripts/test-e2e.sh}
      MNEMONIC_RABBITMQ_URL: amqp://mnemonic_e2e:mnemonic_e2e_only@rabbitmq:5672/
      MNEMONIC_PROMPT_ROOT: /var/lib/mnemonic/prompts
      MNEMONIC_TRANSCRIPT_ROOT: /var/lib/mnemonic/transcripts
      MNEMONIC_TRANSCRIPT_ALLOWED_ROOTS: '["/var/lib/mnemonic/artifacts/transcripts"]'
      MNEMONIC_ARTIFACT_MAX_BYTES: 67108864
      MNEMONIC_ARTIFACT_TIKA_URL: http://tika:9998
      MNEMONIC_BACKUP_TOKEN: ${MNEMONIC_E2E_BACKUP_TOKEN:?Run through scripts/test-e2e.sh}
      MNEMONIC_BACKUP_ROOT: /backups
      MNEMONIC_BACKUP_RETENTION_COUNT: 2
      MNEMONIC_BACKUP_INTERVAL_SECONDS: 86400
      MNEMONIC_BACKUP_MAX_BYTES: 2097152
    volumes:
      - *prompt-mount
      - <<: *artifact-mount
        read_only: true
      - type: bind
        source: ${MNEMONIC_E2E_TRANSCRIPT_DIR:?Run through the isolated test runner}
        target: /var/lib/mnemonic/transcripts
        bind:
          create_host_path: false
      - type: bind
        source: ${MNEMONIC_E2E_BACKUP_DIR:?Run through the isolated test runner}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tika:
        condition: service_healthy
    networks: [default, artifact_parser]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8002/healthz", timeout=3)']
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s
    init: true
    restart: "no"
    security_opt: [no-new-privileges:true]

networks:
  artifact_parser:
    internal: true
