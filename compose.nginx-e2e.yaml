# Static web/FastAPI identity-transport overlay. Invoke through
# scripts/test-nginx-e2e.sh together with compose.e2e.yaml.
services:
  api:
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn browser_transport_upstream:create_app --factory --app-dir /opt/mnemonic --host 0.0.0.0 --port 8000 --no-access-log --log-config logging.json --h11-max-incomplete-event-size 65536
    volumes:
      - ./scripts/fixtures/browser_transport_upstream.py:/opt/mnemonic/browser_transport_upstream.py:ro
      - ./scripts/fixtures/encoding_upstream.py:/opt/mnemonic/encoding_upstream.py:ro

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/test/Dockerfile
    ports:
      - '127.0.0.1:${MNEMONIC_NGINX_E2E_PORT:?Run through scripts/test-nginx-e2e.sh}:8080'
    volumes:
      - ./deploy/nginx/test/mnemonic-nginx-e2e.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/snippets/mnemonic-dashboard-api-policy.conf:/etc/nginx/snippets/mnemonic-dashboard-api-policy.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"
    security_opt: [no-new-privileges:true]

  nginx-stock-policy-check:
    profiles: [policy-check]
    image: nginx:1.29-alpine
    command: [nginx, -t, -c, /etc/nginx/nginx.conf]
    volumes:
      - ./deploy/nginx/test/mnemonic-nginx-stock-policy.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/snippets/mnemonic-dashboard-api-policy.conf:/etc/nginx/snippets/mnemonic-dashboard-api-policy.conf:ro
    restart: "no"
    security_opt: [no-new-privileges:true]
