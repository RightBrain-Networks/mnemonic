name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan trusted history
        if: >-
          ${{
            github.event_name != 'pull_request' ||
            (
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor != 'dependabot[bot]'
            )
          }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Scan untrusted history without secrets
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            (
              github.event.pull_request.head.repo.full_name != github.repository ||
              github.actor == 'dependabot[bot]'
            )
          }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            git --no-banner --no-color --redact --verbose /repo \
            2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          grep -Eq '^[0-9]{1,2}:[0-9]{2}(AM|PM)? INF [1-9][0-9]* commits scanned\.$' \
            "$RUNNER_TEMP/gitleaks.log"

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            mcp/uv.lock
      - name: Install backend quality tools
        run: uv sync --project backend --frozen
      - name: Check backend
        working-directory: backend
        run: uv run ruff check .
      - name: Install MCP quality tools
        run: uv sync --project mcp --frozen
      - name: Check MCP
        working-directory: mcp
        run: uv run ruff check .
      - name: Check operational scripts
        run: |
          uv run --project backend ruff check \
            scripts/audit_duplicate_handling.py \
            scripts/check-stack.py

  ty:
    name: ty
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            mcp/uv.lock
      - name: Install backend
        run: uv sync --project backend --frozen
      - name: Check backend
        working-directory: backend
        run: uv run ty check src
      - name: Install MCP
        run: uv sync --project mcp --frozen
      - name: Check MCP
        working-directory: mcp
        run: uv run ty check src/mnemonic_mcp

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mnemonic_test
          POSTGRES_USER: mnemonic_test
          POSTGRES_PASSWORD: mnemonic_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnemonic_test -d mnemonic_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mnemonic_test:mnemonic_test_only@127.0.0.1:5432/mnemonic_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend
        run: uv sync --project backend --frozen
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest -q

  mcp-tests:
    name: MCP tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock
      - name: Install MCP
        run: uv sync --project mcp --frozen
      - name: Run MCP tests
        working-directory: mcp
        run: uv run pytest -q
      - name: Run repository freshness verifier tests
        run: uv run --project mcp python -m unittest discover -s plugin/tests -p 'test_*.py'

  repository-freshness-runtime:
    name: Repository freshness runtime
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise installed payload with macOS Bash and Git
        env:
          MNEMONIC_AUTHENTIC_BASH: /bin/bash
          MNEMONIC_AUTHENTIC_GIT: git
          MNEMONIC_REQUIRE_EXACT_BASH_3_2: "1"
        run: python3 -m unittest discover -s plugin/tests -p 'test_*.py'

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        # The implicit advisory audit blocks the install on a registry round trip
        # that cannot fail the build, and a hung endpoint stalls it until npm's
        # 300s fetch-timeout. Installing from the committed lockfile needs neither
        # that request nor the funding summary.
        run: npm ci --no-audit --no-fund
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  required:
    name: Required checks
    if: ${{ always() }}
    needs:
      [gitleaks, ruff, ty, backend-tests, mcp-tests, repository-freshness-runtime, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          RUFF_RESULT: ${{ needs.ruff.result }}
          TY_RESULT: ${{ needs.ty.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          MCP_RESULT: ${{ needs.mcp-tests.result }}
          REPOSITORY_FRESHNESS_RUNTIME_RESULT: ${{ needs.repository-freshness-runtime.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          for result in \
            "$GITLEAKS_RESULT" \
            "$RUFF_RESULT" \
            "$TY_RESULT" \
            "$BACKEND_RESULT" \
            "$MCP_RESULT" \
            "$REPOSITORY_FRESHNESS_RUNTIME_RESULT" \
            "$FRONTEND_RESULT"
          do
            test "$result" = "success" || exit 1
          done
