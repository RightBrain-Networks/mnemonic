name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  changes:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI scope selection
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_*.py'
      - name: Check coordinated release versions
        run: python3 scripts/release.py check
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_release*.py'
      - name: Select checks from the complete diff
        id: scope
        run: python3 scripts/ci_scope.py

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan trusted history
        if: >-
          ${{
            github.event_name != 'pull_request' ||
            (
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor != 'dependabot[bot]'
            )
          }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Scan untrusted history without secrets
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            (
              github.event.pull_request.head.repo.full_name != github.repository ||
              github.actor == 'dependabot[bot]'
            )
          }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            git --no-banner --no-color --redact --verbose /repo \
            2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          grep -Eq '^[0-9]{1,2}:[0-9]{2}(AM|PM)? INF [1-9][0-9]* commits scanned\.$' \
            "$RUNNER_TEMP/gitleaks.log"

  ruff:
    name: Ruff
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            mcp/uv.lock
      - name: Install backend quality tools
        run: uv sync --project backend --frozen
      - name: Check backend
        working-directory: backend
        run: uv run ruff check .
      - name: Install MCP quality tools
        run: uv sync --project mcp --frozen
      - name: Check MCP
        working-directory: mcp
        run: uv run ruff check .
      - name: Check operational scripts
        run: |
          uv run --project backend ruff check \
            scripts/audit_duplicate_handling.py \
            scripts/audit_project_activity.py \
            scripts/audit_code_reviews.py \
            scripts/migrate_transcript_copies.py \
            scripts/reclaim_transcript_copies.py \
            scripts/recover_transcript_paths.py \
            scripts/check_transcript_access.py \
            scripts/ci_scope.py \
            scripts/tests/test_ci_scope.py \
            scripts/setup.py \
            scripts/export_agent_skills.py \
            scripts/download_artifact.py \
            scripts/decision_provenance.py \
            plugin/scripts/decision_provenance.py \
            scripts/upload_artifact.py \
            plugin/scripts/upload_artifact.py \
            plugin/scripts/download_artifact.py \
            scripts/seed_e2e_historical_completion.py \
            scripts/test_browser_transport_ingress.py \
            scripts/test_project_backups.py \
            scripts/check-stack.py
          uv run --project backend ruff check --config backend/pyproject.toml \
            scripts/release.py scripts/tests/test_release.py

  ty:
    name: ty
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            mcp/uv.lock
      - name: Install backend
        run: uv sync --project backend --frozen
      - name: Check backend
        working-directory: backend
        run: uv run ty check src
      - name: Install MCP
        run: uv sync --project mcp --frozen
      - name: Check MCP
        working-directory: mcp
        run: uv run ty check src/mnemonic_mcp

  backend-tests:
    name: Backend tests
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.2-alpine@sha256:aab85daef4295ab28df229600109434ed6ed7b966dd915baeb0fc396279f0e8e
        env:
          RABBITMQ_DEFAULT_USER: mnemonic_test
          RABBITMQ_DEFAULT_PASS: mnemonic_test_only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: mnemonic_test
          POSTGRES_USER: mnemonic_test
          POSTGRES_PASSWORD: mnemonic_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnemonic_test -d mnemonic_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mnemonic_test:mnemonic_test_only@127.0.0.1:5432/mnemonic_test
      RABBITMQ_TEST_URL: amqp://mnemonic_test:mnemonic_test_only@127.0.0.1:5672/
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend
        run: uv sync --project backend --frozen
      - name: Install separate MCP environment for upload integration
        run: uv sync --project mcp --frozen
      - name: Run backend tests
        working-directory: backend
        # Each xdist worker is its own process, so the session fixture hands it
        # its own disposable schema. Left off addopts so a plain local run stays
        # serial and readable; -n 0 disables it here.
        run: uv run pytest -q -n auto

  mcp-tests:
    name: MCP tests
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock
      - name: Install MCP
        run: uv sync --project mcp --frozen
      - name: Run MCP tests
        working-directory: mcp
        run: uv run pytest -q
      - name: Run repository freshness verifier tests
        run: uv run --project mcp python -m unittest discover -s plugin/tests -p 'test_*.py'

  repository-freshness-runtime:
    name: Repository freshness runtime
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise installed payload with macOS Bash and Git
        env:
          MNEMONIC_AUTHENTIC_BASH: /bin/bash
          MNEMONIC_AUTHENTIC_GIT: git
          MNEMONIC_REQUIRE_EXACT_BASH_3_2: "1"
        run: python3 -m unittest discover -s plugin/tests -p 'test_*.py'

  frontend:
    name: Frontend checks
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        # The implicit advisory audit blocks the install on a registry round trip
        # that cannot fail the build, and a hung endpoint stalls it until npm's
        # 300s fetch-timeout. Installing from the committed lockfile needs neither
        # that request nor the funding summary.
        run: npm ci --no-audit --no-fund
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  required:
    name: Required checks
    if: ${{ always() }}
    needs:
      [changes, gitleaks, ruff, ty, backend-tests, mcp-tests, repository-freshness-runtime, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FULL_CI: ${{ needs.changes.outputs.full_ci }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          RUFF_RESULT: ${{ needs.ruff.result }}
          TY_RESULT: ${{ needs.ty.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          MCP_RESULT: ${{ needs.mcp-tests.result }}
          REPOSITORY_FRESHNESS_RUNTIME_RESULT: ${{ needs.repository-freshness-runtime.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$CHANGES_RESULT" = "success" || exit 1
          test "$GITLEAKS_RESULT" = "success" || exit 1
          case "$FULL_CI" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          for result in \
            "$RUFF_RESULT" \
            "$TY_RESULT" \
            "$BACKEND_RESULT" \
            "$MCP_RESULT" \
            "$REPOSITORY_FRESHNESS_RUNTIME_RESULT" \
            "$FRONTEND_RESULT"
          do
            test "$result" = "$expected" || exit 1
          done
