name: Versioned release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'RightBrain-Networks/mnemonic' }}
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.baseline.outputs.version }}
      previous_tag: ${{ steps.baseline.outputs.previous_tag }}
      previous_version: ${{ steps.baseline.outputs.previous_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version, main ancestry and required CI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py check --tag "$RELEASE_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/release_github.py verify-ci --commit "$GITHUB_SHA"
      - name: Select previous published stable release
        id: baseline
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_github.py select --tag "$RELEASE_TAG" --release

  candidates:
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/images.yml
    with:
      publish: true

  release:
    name: Test and publish stable release
    needs: [validate, candidates]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
      PREVIOUS_VERSION: ${{ needs.validate.outputs.previous_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image-digests
          path: dist
      - name: Read the original candidate receipt
        id: candidate
        run: python3 scripts/release_registry.py candidate --receipt dist/images.json --commit "$GITHUB_SHA" --version "$RELEASE_VERSION"
      - name: Assemble bundle and draft release
        run: |
          previous=()
          if [[ -n "$PREVIOUS_TAG" ]]; then previous+=(--previous-tag "$PREVIOUS_TAG"); fi
          python3 scripts/release_bundle.py --output dist "${previous[@]}"
          python3 scripts/release_github.py draft --tag "$RELEASE_TAG" --directory dist "${previous[@]}"
      - name: Download and verify previous release bundle
        if: ${{ env.PREVIOUS_TAG != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern "mnemonic-$PREVIOUS_VERSION.tar.gz" --pattern SHA256SUMS --dir "$RUNNER_TEMP/previous"
          (cd "$RUNNER_TEMP/previous" && sha256sum --check --ignore-missing --strict SHA256SUMS)
      - name: Verify anonymous installation and upgrade
        env:
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          # No registry login in this job until after the smoke test. A private
          # package must fail here instead of shipping an unusable public release.
          previous=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            previous+=(--previous-bundle "$RUNNER_TEMP/previous/mnemonic-$PREVIOUS_VERSION.tar.gz" --previous-version "$PREVIOUS_VERSION")
          fi
          python3 scripts/release_smoke.py --bundle "dist/mnemonic-$RELEASE_VERSION.tar.gz" --version "$RELEASE_VERSION" --image-tag "$CANDIDATE_TAG" "${previous[@]}"
      - name: Sign in for release-tag promotion
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested immutable candidates
        run: python3 scripts/release_registry.py promote --receipt dist/images.json --commit "$GITHUB_SHA" --version "$RELEASE_VERSION"
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish the tested draft
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
