name: Release rehearsal

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  upgrade:
    name: Native installation and upgrade rehearsal
    if: ${{ github.event.schedule != '0 13 * * 1' }}
    uses: ./.github/workflows/images.yml
    with:
      upgrade: true

  browser:
    name: Nightly browser acceptance
    if: ${{ github.event.schedule != '0 13 * * 1' }}
    uses: ./.github/workflows/browser.yml

  weekly-preparation:
    name: Prepare the weekly stable release candidate
    if: ${{ github.event.schedule == '0 13 * * 1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check versions and select the baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py check
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')
          python3 scripts/release_github.py select --tag "v$version"
      - name: Prepare release notes and install bundle
        env:
          PREVIOUS_TAG: ${{ steps.baseline.outputs.previous_tag }}
        run: |
          previous=()
          if [[ -n "$PREVIOUS_TAG" ]]; then previous+=(--previous-tag "$PREVIOUS_TAG"); fi
          python3 scripts/release_bundle.py --output dist "${previous[@]}"
          echo 'Candidate prepared. A maintainer reviews upgrade notes and tags a commit that passed Required checks. This job never creates a tag or edits main.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-release-candidate
          path: dist/*
          retention-days: 14
