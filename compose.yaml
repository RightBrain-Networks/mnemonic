name: mnemonic

services:
  rabbitmq:
    image: rabbitmq:4.2-alpine@sha256:aab85daef4295ab28df229600109434ed6ed7b966dd915baeb0fc396279f0e8e
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mnemonic
      RABBITMQ_DEFAULT_PASS: ${MNEMONIC_RABBITMQ_PASSWORD:?Configure a private RabbitMQ password in .env}
    volumes:
      - mnemonic_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: mnemonic
      POSTGRES_USER: mnemonic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py or configure .env first}
    volumes:
      - mnemonic_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mnemonic -d mnemonic']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  init-storage:
    image: ghcr.io/rightbrain-networks/mnemonic-api:${MNEMONIC_VERSION:-0.117.0}
    user: "0:0"
    command: [init-storage]
    environment:
      MNEMONIC_API_UID: ${MNEMONIC_API_UID:-10001}
      MNEMONIC_API_GID: ${MNEMONIC_API_GID:-10001}
      MNEMONIC_STORAGE_MODE: ${MNEMONIC_STORAGE_MODE:-legacy}
    volumes: &storage-mounts
      - mnemonic_artifacts:/var/lib/mnemonic/artifacts
      - mnemonic_prompts:/var/lib/mnemonic/prompts
      - mnemonic_transcripts:/var/lib/mnemonic/transcripts
      - mnemonic_index:/var/lib/mnemonic/transcript-index
      - mnemonic_backups:/backups
    network_mode: none
    restart: "no"
    security_opt: [no-new-privileges:true]

  migrate:
    image: ghcr.io/rightbrain-networks/mnemonic-api:${MNEMONIC_VERSION:-0.117.0}
    user: "${MNEMONIC_API_UID:-10001}:${MNEMONIC_API_GID:-10001}"
    command: [migrate]
    environment:
      DATABASE_URL: postgresql+psycopg://mnemonic:${POSTGRES_PASSWORD}@postgres:5432/mnemonic
      MNEMONIC_API_KEY: ${MNEMONIC_API_KEY}
      MNEMONIC_PROMPT_ROOT: /var/lib/mnemonic/prompts
      MNEMONIC_PRE_MIGRATION_BACKUP: ${MNEMONIC_PRE_MIGRATION_BACKUP:-true}
    volumes: *storage-mounts
    depends_on:
      postgres:
        condition: service_healthy
      init-storage:
        condition: service_completed_successfully
    restart: "no"
    security_opt: [no-new-privileges:true]

  api:
    image: ghcr.io/rightbrain-networks/mnemonic-api:${MNEMONIC_VERSION:-0.117.0}
    user: "${MNEMONIC_API_UID:-10001}:${MNEMONIC_API_GID:-10001}"
    environment:
      DATABASE_URL: postgresql+psycopg://mnemonic:${POSTGRES_PASSWORD}@postgres:5432/mnemonic
      MNEMONIC_API_KEY: ${MNEMONIC_API_KEY:?Run scripts/setup.py or configure .env first}
      TIMEZONE: ${TIMEZONE:-UTC}
      MNEMONIC_BACKUP_URL: http://worker:8002
      MNEMONIC_BACKUP_TOKEN: ${MNEMONIC_BACKUP_TOKEN:?Configure the private dashboard backup token in .env}
      MNEMONIC_BACKUP_MAX_BYTES: ${MNEMONIC_BACKUP_MAX_BYTES:-67108864}
      MNEMONIC_DASHBOARD_ORIGINS: ${MNEMONIC_DASHBOARD_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MNEMONIC_CLIENT_OPERATION_WAIT_SECONDS: ${MNEMONIC_CLIENT_OPERATION_WAIT_SECONDS:-10}
      MNEMONIC_ARTIFACT_ROOT: /var/lib/mnemonic/artifacts
      MNEMONIC_PROMPT_ROOT: /var/lib/mnemonic/prompts
      # Configured sources supply the default allowlist in API settings.
      MNEMONIC_TRANSCRIPT_SOURCE_DIR: ${MNEMONIC_TRANSCRIPT_SOURCE_DIR:-}
      MNEMONIC_CODEX_TRANSCRIPT_SOURCE_DIR: ${MNEMONIC_CODEX_TRANSCRIPT_SOURCE_DIR:-}
      MNEMONIC_CODEX_ARCHIVED_TRANSCRIPT_SOURCE_DIR: ${MNEMONIC_CODEX_ARCHIVED_TRANSCRIPT_SOURCE_DIR:-}
      MNEMONIC_TRANSCRIPT_ALLOWED_ROOTS: ${MNEMONIC_TRANSCRIPT_ALLOWED_ROOTS:-[]}
      MNEMONIC_TRANSCRIPT_MAX_BYTES: ${MNEMONIC_TRANSCRIPT_MAX_BYTES:-1073741824}
      MNEMONIC_TRANSCRIPT_INDEX_DIR: /var/lib/mnemonic/transcript-index
      MNEMONIC_WORK_SUMMARY_MAX_CHARS: ${MNEMONIC_WORK_SUMMARY_MAX_CHARS:-2048}
      MNEMONIC_ARTIFACT_MAX_BYTES: ${MNEMONIC_ARTIFACT_MAX_BYTES:-67108864}
      MNEMONIC_ARTIFACT_TIKA_URL: http://tika:9998
      MNEMONIC_ARTIFACT_EXTRACTION_MAX_CHARS: ${MNEMONIC_ARTIFACT_EXTRACTION_MAX_CHARS:-2000000}
      MNEMONIC_ARTIFACT_EXTRACTION_TIMEOUT_SECONDS: ${MNEMONIC_ARTIFACT_EXTRACTION_TIMEOUT_SECONDS:-60}
      MNEMONIC_DUPLICATE_SUGGESTION_BODY_MAX_BYTES: ${MNEMONIC_DUPLICATE_SUGGESTION_BODY_MAX_BYTES:-2097152}
      MNEMONIC_DUPLICATE_SUGGESTION_REQUEST_SLOTS: ${MNEMONIC_DUPLICATE_SUGGESTION_REQUEST_SLOTS:-4}
      MNEMONIC_DUPLICATE_SUGGESTION_REQUEST_WAIT_MS: ${MNEMONIC_DUPLICATE_SUGGESTION_REQUEST_WAIT_MS:-250}
      MNEMONIC_DUPLICATE_SUGGESTION_INFERENCE_SLOTS: ${MNEMONIC_DUPLICATE_SUGGESTION_INFERENCE_SLOTS:-2}
      MNEMONIC_DUPLICATE_SUGGESTION_INFERENCE_WAIT_MS: ${MNEMONIC_DUPLICATE_SUGGESTION_INFERENCE_WAIT_MS:-5000}
      MNEMONIC_DUPLICATE_SUGGESTION_INFERENCE_QUEUE_SIZE: ${MNEMONIC_DUPLICATE_SUGGESTION_INFERENCE_QUEUE_SIZE:-8}
      MNEMONIC_DUPLICATE_SUGGESTION_INFERENCE_THREADS: ${MNEMONIC_DUPLICATE_SUGGESTION_INFERENCE_THREADS:-1}
      MNEMONIC_DUPLICATE_SUGGESTION_LEXICAL_SHORTLIST: ${MNEMONIC_DUPLICATE_SUGGESTION_LEXICAL_SHORTLIST:-200}
      MNEMONIC_DUPLICATE_SUGGESTION_MISSING_VECTOR_LIMIT: ${MNEMONIC_DUPLICATE_SUGGESTION_MISSING_VECTOR_LIMIT:-128}
      MNEMONIC_DUPLICATE_SUGGESTION_FULL_POPULATION_CEILING: ${MNEMONIC_DUPLICATE_SUGGESTION_FULL_POPULATION_CEILING:-10000}
      MNEMONIC_DUPLICATE_SUGGESTION_TIMEOUT_SECONDS: ${MNEMONIC_DUPLICATE_SUGGESTION_TIMEOUT_SECONDS:-45}
    volumes:
      - &prompt-mount
        type: volume
        source: mnemonic_prompts
        target: /var/lib/mnemonic/prompts
      - type: volume
        source: mnemonic_artifacts
        target: /var/lib/mnemonic/artifacts
      # Without a configured source, expose only the shipped empty placeholder.
      - &claude-source
        type: bind
        source: ${MNEMONIC_TRANSCRIPT_SOURCE_DIR:-./deploy/empty-transcripts}
        target: ${MNEMONIC_TRANSCRIPT_SOURCE_DIR:-/var/lib/mnemonic/transcript-source-disabled}
        read_only: true
        bind:
          create_host_path: false
      # Mount Codex session directories only; its parent can contain credentials.
      - &codex-source
        type: bind
        source: ${MNEMONIC_CODEX_TRANSCRIPT_SOURCE_DIR:-./deploy/empty-transcripts}
        target: ${MNEMONIC_CODEX_TRANSCRIPT_SOURCE_DIR:-/var/lib/mnemonic/codex-transcript-source-disabled}
        read_only: true
        bind:
          create_host_path: false
      - &codex-archived-source
        type: bind
        source: ${MNEMONIC_CODEX_ARCHIVED_TRANSCRIPT_SOURCE_DIR:-./deploy/empty-transcripts}
        target: ${MNEMONIC_CODEX_ARCHIVED_TRANSCRIPT_SOURCE_DIR:-/var/lib/mnemonic/codex-archived-transcript-source-disabled}
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: mnemonic_index
        target: /var/lib/mnemonic/transcript-index
      - mnemonic_transcripts:/var/lib/mnemonic/transcripts:ro
    ports:
      - '127.0.0.1:${MNEMONIC_API_PORT:-8000}:8000'
    networks: [default, artifact_parser]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  tika:
    image: ghcr.io/rightbrain-networks/mnemonic-tika:${MNEMONIC_VERSION:-0.117.0}
    environment:
      MNEMONIC_ARTIFACT_EXTRACTION_MAX_CHARS: ${MNEMONIC_ARTIFACT_EXTRACTION_MAX_CHARS:-2000000}
      MNEMONIC_ARTIFACT_EXTRACTION_TIMEOUT_SECONDS: ${MNEMONIC_ARTIFACT_EXTRACTION_TIMEOUT_SECONDS:-60}
    # Artifact parser: no published port, source mount or database access.
    networks: [artifact_parser]
    dns: [127.0.0.1]
    logging:
      driver: none
    healthcheck:
      test: [CMD, bash, /opt/mnemonic-tika/healthcheck.sh]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=1280m,mode=1777,noexec,nosuid,nodev
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  mcp:
    image: ghcr.io/rightbrain-networks/mnemonic-mcp:${MNEMONIC_VERSION:-0.117.0}
    environment:
      MNEMONIC_API_URL: http://api:8000
      MNEMONIC_API_KEY: ${MNEMONIC_API_KEY}
      MNEMONIC_MCP_HOST: 0.0.0.0
      MNEMONIC_MCP_PORT: 8001
      MNEMONIC_MCP_PUBLIC_URL: ${MNEMONIC_MCP_PUBLIC_URL:-}
      MNEMONIC_MCP_ALLOWED_HOSTS: 'localhost:${MNEMONIC_MCP_PORT:-8001},127.0.0.1:${MNEMONIC_MCP_PORT:-8001},[::1]:${MNEMONIC_MCP_PORT:-8001},127.0.0.1:8001,mcp:8001'
      MNEMONIC_MCP_ALLOWED_ORIGINS: 'http://localhost:${MNEMONIC_MCP_PORT:-8001},http://127.0.0.1:${MNEMONIC_MCP_PORT:-8001}'
    ports:
      - '127.0.0.1:${MNEMONIC_MCP_PORT:-8001}:8001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/healthz", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  web:
    image: ghcr.io/rightbrain-networks/mnemonic-web:${MNEMONIC_VERSION:-0.117.0}
    ports:
      - '127.0.0.1:${MNEMONIC_WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  worker:
    image: ghcr.io/rightbrain-networks/mnemonic-api:${MNEMONIC_VERSION:-0.117.0}
    user: "${MNEMONIC_API_UID:-10001}:${MNEMONIC_API_GID:-10001}"
    command: [serve-worker]
    environment:
      DATABASE_URL: postgresql+psycopg://mnemonic:${POSTGRES_PASSWORD}@postgres:5432/mnemonic
      MNEMONIC_API_KEY: ${MNEMONIC_API_KEY}
      MNEMONIC_RABBITMQ_URL: amqp://mnemonic:${MNEMONIC_RABBITMQ_PASSWORD}@rabbitmq:5672/
      MNEMONIC_PROMPT_ROOT: /var/lib/mnemonic/prompts
      MNEMONIC_TRANSCRIPT_ROOT: /var/lib/mnemonic/transcripts
      MNEMONIC_DUPLICATE_SUGGESTION_INFERENCE_THREADS: ${MNEMONIC_DUPLICATE_SUGGESTION_INFERENCE_THREADS:-1}
      MNEMONIC_TRANSCRIPT_SOURCE_DIR: ${MNEMONIC_TRANSCRIPT_SOURCE_DIR:-}
      MNEMONIC_CODEX_TRANSCRIPT_SOURCE_DIR: ${MNEMONIC_CODEX_TRANSCRIPT_SOURCE_DIR:-}
      MNEMONIC_CODEX_ARCHIVED_TRANSCRIPT_SOURCE_DIR: ${MNEMONIC_CODEX_ARCHIVED_TRANSCRIPT_SOURCE_DIR:-}
      MNEMONIC_TRANSCRIPT_ALLOWED_ROOTS: ${MNEMONIC_TRANSCRIPT_ALLOWED_ROOTS:-[]}
      MNEMONIC_TRANSCRIPT_MAX_BYTES: ${MNEMONIC_TRANSCRIPT_MAX_BYTES:-1073741824}
      MNEMONIC_ARTIFACT_MAX_BYTES: ${MNEMONIC_ARTIFACT_MAX_BYTES:-67108864}
      MNEMONIC_ARTIFACT_TIKA_URL: http://tika:9998
      MNEMONIC_ARTIFACT_EXTRACTION_MAX_CHARS: ${MNEMONIC_ARTIFACT_EXTRACTION_MAX_CHARS:-2000000}
      MNEMONIC_ARTIFACT_EXTRACTION_TIMEOUT_SECONDS: ${MNEMONIC_ARTIFACT_EXTRACTION_TIMEOUT_SECONDS:-60}
      MNEMONIC_BACKUP_TOKEN: ${MNEMONIC_BACKUP_TOKEN:?Configure the private dashboard backup token in .env}
      MNEMONIC_BACKUP_ROOT: /backups
      # This is the actual container path for the default private Docker volume.
      # The bind overlay replaces this display value with its configured host path.
      MNEMONIC_BACKUP_DIR: /backups
      MNEMONIC_BACKUP_SERVER_RESTORE_MAX_BYTES: ${MNEMONIC_BACKUP_SERVER_RESTORE_MAX_BYTES:-68719476736}
      MNEMONIC_ARTIFACT_ROOT: /var/lib/mnemonic/artifacts
      MNEMONIC_BACKUP_MAX_BYTES: ${MNEMONIC_BACKUP_MAX_BYTES:-67108864}
      MNEMONIC_BACKUP_EXPANDED_MAX_BYTES: ${MNEMONIC_BACKUP_EXPANDED_MAX_BYTES:-268435456}
    volumes:
      # Selected exports can finish journaled artifact recovery, as API downloads do.
      - mnemonic_artifacts:/var/lib/mnemonic/artifacts
      - *prompt-mount
      - *claude-source
      - *codex-source
      - *codex-archived-source
      - type: volume
        source: mnemonic_transcripts
        target: /var/lib/mnemonic/transcripts
      - type: volume
        source: mnemonic_backups
        target: /backups
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [default, artifact_parser]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8002/healthz", timeout=3)']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

volumes:
  mnemonic_data:
  mnemonic_rabbitmq:
  mnemonic_artifacts:
  mnemonic_prompts:
  mnemonic_transcripts:
  mnemonic_index:
  mnemonic_backups:

networks:
  artifact_parser:
    internal: true
