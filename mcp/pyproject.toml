[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mnemonic-mcp"
version = "0.19.0"
description = "MCP adapter for Mnemonic work items and immutable checkpoints"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx>=0.28.1,<1",
  "mcp>=1.26.0,<2",
  "pydantic>=2.13.5,<3",
  "starlette>=0.40,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
mnemonic-mcp = "mnemonic_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.11,<1",
    "ty>=0.0.77,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mnemonic_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
extend-select = ["C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
