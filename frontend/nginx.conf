worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Docker may assign a new address when API alone is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $uri $browser_upgrade {
        default '';
        /api/mnemonic/sync $http_upgrade;
    }
    map $browser_upgrade $browser_connection {
        default upgrade;
        '' '';
    }

    server {
        listen 3000;
        root /usr/share/nginx/html;
        # Artifact metadata permits one 16 KiB header plus its framing.
        large_client_header_buffers 4 64k;
        include /etc/nginx/snippets/mnemonic-web-security.conf;
        add_header Cache-Control "no-cache" always;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # Only these browser namespaces are public. Preserve their complete
        # paths, external authority, raw bytes, and the exact sync upgrade.
        location ~ ^/api/(?:mnemonic|artifacts|transcripts|backups)(?:/|$) {
            include /etc/nginx/snippets/mnemonic-dashboard-api-policy.conf;
            # API owns configured limits, including replay after lowering them.
            client_max_body_size 0;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 1805s;
            proxy_send_timeout 1805s;
            proxy_next_upstream off;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header Upgrade $browser_upgrade;
            proxy_set_header Connection $browser_connection;
            set $api_backend api:8000;
            proxy_pass http://$api_backend$request_uri;
        }

        location ~ ^/(?:api|worker|projects|docs|redoc|openapi\.json|readyz)(?:/|$) {
            return 404;
        }

        # Vite fingerprints build assets. Missing assets must never become HTML.
        location ^~ /assets/ {
            include /etc/nginx/snippets/mnemonic-web-security.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location ~ /\. {
            return 404;
        }
        location ~ \.[^/]+$ {
            try_files $uri =404;
        }
        location = / {
            try_files /index.html =404;
        }
        location ~ ^/(?:work-items|attention|code-reviews|summaries|artifacts|transcripts|settings/(?:workspace|prompts|code-reviews|backups))/?$ {
            try_files /index.html =404;
        }
        location / {
            try_files $uri =404;
        }
    }
}
