[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mnemonic-api"
version = "0.49.0"
description = "Mnemonic's project-scoped work-item and immutable-checkpoint REST API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "anyio>=4,<5",
  "fastapi>=0.115,<1",
  "fastembed>=0.8,<0.9",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy>=2.0.41,<2.1",
  "tantivy>=0.26,<0.27",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "jsonschema[format]>=4.25,<5",
    "pytest>=8.3,<10",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.11,<1",
    "ty>=0.0.77,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mnemonic_api", "src/mnemonic_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires a real PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.hatch.build.targets.wheel.force-include]
"../prompts/recall-pointer.md" = "mnemonic_api/prompts/recall-pointer.md"
"../prompts/job-completion-report.md" = "mnemonic_api/prompts/job-completion-report.md"
"../prompts/cold-code-review.md" = "mnemonic_api/prompts/cold-code-review.md"
"../prompts/warm-code-review.md" = "mnemonic_api/prompts/warm-code-review.md"
"../prompts/review-recommendation.md" = "mnemonic_api/prompts/review-recommendation.md"
"../prompts/review-remediation.md" = "mnemonic_api/prompts/review-remediation.md"
"../prompts/resume-work.md" = "mnemonic_api/prompts/resume-work.md"
